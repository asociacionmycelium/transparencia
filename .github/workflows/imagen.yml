# Construye la imagen de la página (#15, D32) y, en main, la publica en GHCR como sha-<7>.
# No despliega: a QA se llega con release-qa y a prod con release-prod. Ver web/README.md, «Imagen».
#
# workflow_dispatch lo usa regenera (#12): lo que sube el token de un workflow no lanza otros
# workflows, así que el commit de la regeneración no dispararía el push.
#
# Sin acciones de terceros: la organización solo admite las de GitHub (D23). docker y buildx ya
# vienen en el runner, y aquí se llaman directamente.
name: imagen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imagen-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGEN: ghcr.io/asociacionmycelium/transparencia-web
  # BuildKit para el build multiarquitectura, fijado por digest.
  BUILDKIT: moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c

jobs:
  prueba:
    name: construye y prueba (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construye
        run: docker buildx build --load -t transparencia-web:prueba -f web/imagen/Dockerfile web
      - name: Arranca como en el clúster
        run: |
          docker run -d --name web --read-only --tmpfs /tmp --user 101:101 \
            --cap-drop ALL --security-opt no-new-privileges -p 8080:8080 transparencia-web:prueba
          for _ in $(seq 20); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && exit 0; sleep 0.5; done
          docker logs web; exit 1
      - name: Cabeceras de web/cabeceras
        run: python3 -I web/imagen/comprueba.py http://127.0.0.1:8080
      - name: Los logs no guardan quién visita (#25)
        run: |
          curl -fsS -o /dev/null -A agente-de-prueba \
            -H 'X-Forwarded-For: 203.0.113.7' -H 'CF-Connecting-IP: 198.51.100.9' \
            -H 'Referer: https://referente.example/' 'http://127.0.0.1:8080/?q=consulta-de-prueba'
          docker logs web > logs.txt 2>&1
          cat logs.txt
          if grep -E '203\.0\.113\.7|198\.51\.100\.9|agente-de-prueba|referente\.example|consulta-de-prueba' logs.txt; then
            echo "::error::los logs de nginx guardan datos de quien visita"; exit 1
          fi

  publica:
    name: publica en GHCR (amd64 + arm64)
    needs: prueba
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Etiqueta y builder multiarquitectura
        run: |
          echo "ETIQUETA=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          docker buildx create --name multi --driver docker-container --driver-opt "image=$BUILDKIT" --use
      - name: Entra en GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # Los workers del clúster son arm64. La etapa final no tiene RUN, así que no hace falta QEMU.
      # Sin atestaciones de buildx: su procedencia copia el evento de GitHub entero (mensajes de
      # commit, autores, quién hizo el push) dentro de la imagen. Todo eso ya es público en el
      # repositorio, pero si un día hubiera que borrar algo del historial, la imagen lo seguiría
      # llevando.
      - name: Construye y publica
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --provenance=false --sbom=false \
            -t "$IMAGEN:$ETIQUETA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-or-later" \
            --metadata-file meta.json \
            -f web/imagen/Dockerfile web
      - name: Resumen
        run: |
          digest=$(jq -r '."containerimage.digest"' meta.json)
          arqs=$(docker buildx imagetools inspect "$IMAGEN:$ETIQUETA" --raw \
            | jq -r '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort | unique | join(",")')
          case ",$arqs," in *,arm64,*) ;; *) echo "::error::la imagen no trae arm64 ($arqs)"; exit 1 ;; esac
          {
            echo "| imagen | etiqueta | digest | arquitecturas |"
            echo "|---|---|---|---|"
            echo "| \`$IMAGEN\` | \`$ETIQUETA\` | \`$digest\` | $arqs |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Sale de GHCR
        if: always()
        run: docker logout ghcr.io
