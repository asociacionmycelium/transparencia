# Bloquea la publicación accidental de documentos firmados o datos personales.
name: guardia

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  datos-personales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: scripts/guardia.sh historia
