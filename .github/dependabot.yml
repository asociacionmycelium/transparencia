# Mantiene al día las acciones fijadas por SHA (la organización exige SHA completo).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  # Las imágenes base de web/imagen/Dockerfile van fijadas por digest.
  - package-ecosystem: docker
    directory: /web/imagen
    schedule:
      interval: weekly
    # nginx va en la rama stable (pares: 1.30, 1.32…): solo parches. El salto a la siguiente
    # stable se hace a mano. Las impares (1.31…) son mainline.
    ignore:
      - dependency-name: nginxinc/nginx-unprivileged
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    commit-message:
      prefix: "ci"
