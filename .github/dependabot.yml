# Mantiene al día las acciones fijadas por SHA (la organización exige SHA completo).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  # Las imágenes base de web/imagen/Dockerfile van fijadas por digest.
  - package-ecosystem: docker
    directory: /web/imagen
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
